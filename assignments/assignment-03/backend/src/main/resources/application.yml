server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: mathmate
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mathmate?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:mathmate}
    password: ${DB_PASSWORD:mathmate}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
      continue-on-error: false
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

mybatis:
  mapper-locations: classpath:mappers/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  jwt:
    secret: ${JWT_SECRET:MathMate-2026-JWT-Secret-Key-Please-Change-In-Production-0123456789}
    expiration-ms: 604800000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  demo:
    enabled: ${DEMO_ENABLED:true}
  agent:
    weekly-enabled: ${AGENT_WEEKLY_ENABLED:true}
    weekly-url: ${AGENT_WEEKLY_URL:http://127.0.0.1:8000/v1/weekly-narrative}
    timeout-ms: ${AGENT_TIMEOUT_MS:8000}
  avatar:
    max-size: ${AVATAR_MAX_SIZE:5242880}
    local-root: ${AVATAR_LOCAL_ROOT:uploads}
    oss:
      enabled: ${OSS_ENABLED:false}
      endpoint: ${OSS_ENDPOINT:}
      bucket: ${OSS_BUCKET:}
      access-key-id: ${OSS_ACCESS_KEY_ID:}
      access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
      public-base-url: ${OSS_PUBLIC_BASE_URL:}
      upload-expiration-seconds: ${OSS_UPLOAD_EXPIRATION_SECONDS:600}

logging:
  level:
    com.mathmate.mapper: debug
