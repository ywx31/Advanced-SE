services:
  mysql:
    image: mysql:8.4
    container_name: mathmate-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mathmate
      MYSQL_USER: mathmate
      MYSQL_PASSWORD: mathmate
    ports:
      - "3306:3306"
    volumes:
      - mathmate_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mathmate_mysql_data:
